version: "3.8"
services:
  infrahub:
    build:
      context: .
      dockerfile: Dockerfile.infrahub
      args:
        # Build-time args (can be set in an environment file or exported before running docker compose)
        USER: ${SANDBOX_USER:-dev}
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}
        TERRAFORM_VERSION: ${TERRAFORM_VERSION:-1.5.7}
        HELM_VERSION: ${HELM_VERSION:-v3.12.0}
        NODE_SETUP_VERSION: ${NODE_SETUP_VERSION:-18}
        INSTALL_DOCKERCLI: ${INSTALL_DOCKERCLI:-false}
        INSTALL_GOLANG: ${INSTALL_GOLANG:-false}
    image: infrahub-sandbox:latest
    container_name: infrahub
    volumes:
      - ./workspace:/workspace:rw
      - ${HOME}/.ssh:/home/${SANDBOX_USER:-dev}/.ssh:ro
    environment:
      - TZ=UTC
    tty: true
    stdin_open: true
